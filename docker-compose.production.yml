# Production — CSDL là MySQL 8.4 chạy riêng (container 'procurement-mysql', network 'dego-db',
# định nghĩa ở ~/procurement-db/ trên VPS, NGOÀI repo này), database 'procurement'.
# Web (nginx static + proxy /api) join 'proxy-tier' để Cloudflare Tunnel gọi tới.
# KHÔNG có service db ở đây — CSDL cố ý tách ra bộ compose riêng để deploy app không đụng tới nó.
#
# Lịch sử: trước 2026-08-11 dùng chung MariaDB của bộ ERPNext ('dego-erp-db-1', net 'dego-erp_default');
# đã chuyển sang MySQL 8.4 và xoá bộ ERPNext (CR-059).
#
# ⚠ ~/procurement-tool (prod) và ~/procurement-tool-dev là HAI WORKTREE của cùng 1 repo git —
#   prod giữ nhánh `main`, dev giữ nhánh `bao`, KHÔNG được để chung nhánh. Cập nhật code bằng:
#       cd ~/procurement-tool && git fetch origin && git reset --hard origin/main
#   rồi kiểm `git status --short` phải RỖNG trước khi build (xem chú thích trong compose dev).

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    env_file: .env
    restart: always
    command: ["sh", "start.prod.sh"]
    networks:
      - dego-db                 # để tới MySQL procurement-mysql:3306
      - procurement-internal    # để web (nginx) proxy /api tới

  # Forwarder chỉ để truy cập DB 'procurement' từ máy local QUA SSH TUNNEL.
  # Bind 127.0.0.1 trên VPS -> KHÔNG lộ ra internet (UFW/loopback). Muốn tắt: comment cả block.
  db-forward:
    image: alpine/socat
    container_name: procurement-db-forward
    restart: always
    command: TCP-LISTEN:3306,fork,reuseaddr TCP:procurement-mysql:3306
    ports:
      - "127.0.0.1:13306:3306"
    networks:
      - dego-db

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web.prod
      args:
        VITE_API_URL: "https://thumua.degoholding.vn"
        VITE_GOOGLE_CLIENT_ID: "${VITE_GOOGLE_CLIENT_ID:-}"   # Client ID đăng nhập Google (baked lúc build web)
        VITE_DEVELOPER_MODE: "${VITE_DEVELOPER_MODE:-}"   # bật chế độ Dev (đổi user) khi .env đặt =dev; mặc định tắt
        VITE_PWA_INSTALL_PROMPT: "${VITE_PWA_INSTALL_PROMPT:-}"   # hiện banner "Cài ứng dụng" khi .env đặt =on; mặc định ẩn
        VITE_FEATURE_TICKET: "${VITE_FEATURE_TICKET:-off}"   # Phiếu hỗ trợ (ticket): prod mặc định TẮT; đặt =on trong .env để bật
        VITE_HELP_URL: "https://help.degoholding.vn"          # Trung tâm HDSD là app riêng (subdomain riêng)
    container_name: procurement-web
    restart: always
    depends_on:
      - api
    networks:
      - procurement-internal
      - proxy-tier              # để cloudflare_tunnel (cùng net) gọi http://procurement-web:80

  # Trung tâm Hướng dẫn sử dụng — app riêng, dùng chung backend + tài khoản.
  # Cloudflare tunnel trỏ help.degoholding.vn -> http://procurement-help:80
  help:
    build:
      context: .
      dockerfile: docker/Dockerfile.help.prod
      args:
        VITE_API_URL: ""        # rỗng = gọi cùng origin, nginx trong container proxy /api -> api:8000
    container_name: procurement-help
    restart: always
    depends_on:
      - api
    networks:
      - procurement-internal
      - proxy-tier

  # --- Celery / Redis (chạy tác vụ ngầm + theo lịch). KHÔNG có RedisInsight ở prod. ---
  redis:
    image: redis:7.2-alpine
    restart: always
    command: redis-server --save 60 1
    volumes:
      - redis_data:/data
    networks:
      - procurement-internal

  celery-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    env_file: .env
    restart: always
    command: celery -A app.core.celery_app worker -l info -c 2
    depends_on:
      - redis
      - api
    networks:
      - dego-db                 # tới MySQL procurement-mysql
      - procurement-internal    # tới redis

  celery-beat:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    env_file: .env
    restart: always
    command: celery -A app.core.celery_app beat -l info --scheduler celery.beat:PersistentScheduler --schedule /app/beatdata/celerybeat-schedule
    depends_on:
      - redis
      - celery-worker
    volumes:
      - beat_data:/app/beatdata   # giữ mốc lịch (celerybeat-schedule) qua các lần dựng lại
    networks:
      - procurement-internal

networks:
  dego-db:                    # do ~/procurement-db/ tạo (docker network create dego-db)
    external: true
  proxy-tier:
    external: true
  procurement-internal:
    driver: bridge

volumes:
  redis_data:
  beat_data:
