# Alembic của DỊCH VỤ AI (ai-CR-119): database `agent_hub`, chỉ các bảng ở app/core/agent_tables.py.
#   alembic -c alembic_agent.ini upgrade head
#   alembic -c alembic_agent.ini revision --autogenerate -m "mo_ta"
[alembic]
script_location = migrations_agent
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
