# MÁY SỬA MÃ chạy NGAY TRÊN VPS 2 (V-08, ai-CR-186 — đại ca chốt 13/10/2026: dời máy sửa mã lên VPS, tắt hẳn máy đại ca).
#
# Khác bản `docker-compose.runner.yml` (máy ngoài): KHÔNG có container `tunnel` — DB và Redis dev nằm cùng máy, runner
# dùng mạng host và trỏ thẳng vào hai cổng chuyển tiếp chỉ nghe 127.0.0.1 (socat db-forward 13306, redis-agent-forward
# 16379 của stack dev). Deploy dev = ssh vào CHÍNH máy (AGENT_VPS_HOST=127.0.0.1, cổng SSH của VPS) bằng khóa riêng của
# runner, cùng đường như máy ngoài nên mã không đổi.
#
#   cp .env.runner.example .env.runner   # điền theo doc/agent-hub/05-may-sua-ma.md mục 6 (DB_PORT=13306, REDIS 16379)
#   docker compose --env-file .env.runner -p agentrunner -f docker-compose.runner.vps.yml up -d --build
#   docker compose --env-file .env.runner -p agentrunner -f docker-compose.runner.vps.yml logs -f
#
# Tài nguyên (đo 13/10 trên máy đại ca): rảnh ~150 MB; chạy Claude Code + pytest / tsc 1–2,5 GB, 1–2 nhân trong vài phút
# mỗi việc. VPS 2 rảnh còn ~4 GB → trần 2,5 GB / 2 nhân, kèm swap 2 GB làm đệm (doc 05 §6).
services:
  agent-runner:
    build:
      context: .
      dockerfile: docker/Dockerfile.runner
    env_file: .env.runner
    environment:
      AGENT_LONG_POLL: "true"
      C_FORCE_ROOT: "1"
      AGENT_REPO_SOURCE: ${AGENT_REPO_SOURCE:-https://github.com/giabaohb99/procurement-tool.git}
    network_mode: host
    mem_limit: ${AGENT_RUNNER_MEM_LIMIT:-2560m}
    cpus: ${AGENT_RUNNER_CPUS:-2}
    volumes:
      - agent_runner_worktrees:/worktrees
      # Khóa SSH để deploy dev vào chính máy này (authorized_keys giới hạn lệnh như doc 05 §1.3 / §6).
      - type: bind
        source: ${AGENT_VPS_SSH_KEY_FILE:-./docker/vps_ssh_key.placeholder}
        target: /root/vps_ssh_key
        read_only: true
    command: ["sh", "/app/start.runner.sh"]
    stop_grace_period: 60s
    restart: unless-stopped

volumes:
  agent_runner_worktrees:
