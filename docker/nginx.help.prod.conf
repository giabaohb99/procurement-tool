server {
    listen 80;
    server_name _;
    client_max_body_size 35m;                 # ảnh/file chèn vào bài hướng dẫn

    root /usr/share/nginx/html;
    index index.html;

    # API → backend FastAPI (cùng docker network 'procurement-internal' của project)
    location /api/ {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # (Ảnh/file đính kèm nằm ở /api/uploads nên đã đi qua location /api/ ở trên.)

    # SPA (React Router) — fallback về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # URL hỏng (vd dán thiếu ký tự: /bao-cao-mua-hang%) làm nginx trả 400 kèm trang lỗi thô của
    # nginx. Trả index.html để React tự hiện "Không tìm thấy bài viết" — người dùng còn header,
    # menu, ô tìm kiếm mà đi tiếp, thay vì mắc kẹt ở trang trắng chữ đen.
    error_page 400 404 = /index.html;
}
