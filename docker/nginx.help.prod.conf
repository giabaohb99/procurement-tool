server {
    listen 80;
    server_name _;
    client_max_body_size 35m;                 # ảnh/file chèn vào bài hướng dẫn

    root /usr/share/nginx/html;
    index index.html;

    #  BM-019 (bao-CR-655): header bảo mật chung. nginx BỎ kế thừa add_header khi location có add_header riêng —
    #  location nào tự đặt add_header thì phải chép lại khối này vào đó (đã chép ở các location bên dưới).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # API → backend FastAPI (cùng docker network 'procurement-internal' của project)
    location /api/ {
        #  ai-CR-187 (13/10/2026): nginx phân giải tên `api` MỘT lần lúc khởi động và ghim IP; recreate api (deploy, đặt
        #  mem_limit) đổi IP là 502 tới khi restart nginx. Dùng DNS nội bộ của Docker + biến để phân giải lại mỗi 10 giây.
        resolver           127.0.0.11 valid=10s ipv6=off;
        set                $api_upstream http://api:8000;
        proxy_pass         $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # (Ảnh/file đính kèm nằm ở /api/uploads nên đã đi qua location /api/ ở trên.)

    # SPA (React Router) — fallback về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # URL hỏng (vd dán thiếu ký tự: /bao-cao-mua-hang%) làm nginx trả 400 kèm trang lỗi thô của
    # nginx. Trả index.html để React tự hiện "Không tìm thấy bài viết" — người dùng còn header,
    # menu, ô tìm kiếm mà đi tiếp, thay vì mắc kẹt ở trang trắng chữ đen.
    error_page 400 404 = /index.html;
}
