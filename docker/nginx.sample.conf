# Nginx reverse proxy mẫu cho Mini Tool Thu Mua.
# Web (Vite/React) ở cổng 8080, API (FastAPI) ở cổng 8000 (theo docker-compose.yml).
# Sau khi bật, chạy: certbot --nginx -d thumuatool.degoholding.vn  (tự thêm block 443 + SSL)

server {
    listen 80;
    server_name thumuatool.degoholding.vn;   # ĐỔI domain của bạn

    client_max_body_size 80m;                  # 1 lần lưu gửi NHIỀU file trong 1 request (mỗi file max 20-30MB)

    # API
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Frontend (SPA)
    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;   # cho Vite HMR (dev); prod build thì bỏ cũng được
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
    }
}
