# nginx phục vụ bản build tĩnh của ERP v2 (frontend-v2/).
# Giống `nginx.prod.conf` của `frontend/` nhưng bỏ phần PWA: v2 chưa đăng ký service worker.
server {
    listen 80;
    server_name _;
    client_max_body_size 100m;                # CR-148 main: mỗi file tối đa 50MB; 100m = trần 1 request của Cloudflare tunnel free

    root /usr/share/nginx/html;
    index index.html;

    #  ai-CR-222 (Agent 1 rà 19/10): chống clickjacking. Cả site chỉ cho nhúng CÙNG NGUỒN — màn xem trước tệp đính kèm /
    #  bản in dùng iframe cùng nguồn nên không đặt DENY ở đây. Màn đồng ý OAuth thì DENY hẳn (location riêng bên dưới).
    #  Không location nào khác tự đặt add_header, nên hai dòng này áp cho mọi câu trả (nginx bỏ kế thừa khi location có
    #  add_header riêng — thêm add_header ở location nào thì chép lại hai dòng này vào đó).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;

    # API -> backend FastAPI (cùng docker network 'procurement-internal')
    location /api/ {
        #  ai-CR-187 (13/10/2026): nginx phân giải tên `api` MỘT lần lúc khởi động và ghim IP; recreate api (deploy, đặt
        #  mem_limit) đổi IP là 502 tới khi restart nginx. Dùng DNS nội bộ của Docker + biến để phân giải lại mỗi 10 giây.
        resolver           127.0.0.11 valid=10s ipv6=off;
        set                $api_upstream http://api:8000;
        proxy_pass         $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    #  Cầu nối mcp-remote (Claude Desktop nối cổng MCP) dò OAuth ở `/.well-known/oauth-*` và
    #  `/.well-known/openid-configuration` TRƯỚC khi nối; nhận trang index.html (200, HTML) nó đọc như JSON rồi chết
    #  «Unexpected token '<'» (19/10/2026, bao-CR-625 trả 404). ai-CR-218 (K14): cổng MCP nay CÓ OAuth (ChatGPT,
    #  claude.ai) — chuyển nguyên sang api để trả tài liệu mô tả JSON thật (openid-configuration không có → api trả 404 JSON).
    #  mcp-remote có khóa header hợp lệ vẫn đi thẳng (chỉ vào OAuth khi 401).
    location ~ ^/\.well-known/(oauth-|openid-configuration) {
        resolver           127.0.0.11 valid=10s ipv6=off;
        set                $api_upstream http://api:8000;
        proxy_pass         $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    #  ai-CR-222: màn đồng ý OAuth (/oauth/consent/<req>) — kẻ xấu tự đăng ký ứng dụng rồi nhúng màn này vào iframe, đè nút
    #  giả lên «Cho phép» là lấy được kết nối 90 ngày. Cấm nhúng ở BẤT KỲ đâu, kể cả cùng nguồn.
    location ^~ /oauth/consent/ {
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }

    # SPA (React Router) — fallback về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
