# nginx phục vụ bản build tĩnh của ERP v2 (frontend-v2/).
# Giống `nginx.prod.conf` của `frontend/` nhưng bỏ phần PWA: v2 chưa đăng ký service worker.
server {
    listen 80;
    server_name _;
    client_max_body_size 100m;                # CR-148 main: mỗi file tối đa 50MB; 100m = trần 1 request của Cloudflare tunnel free

    root /usr/share/nginx/html;
    index index.html;

    # API -> backend FastAPI (cùng docker network 'procurement-internal')
    location /api/ {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # SPA (React Router) — fallback về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
