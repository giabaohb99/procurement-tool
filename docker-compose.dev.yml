# Dev-UAT — CSDL là MySQL 8.4 chạy riêng ('procurement-mysql', net 'dego-db', xem ~/procurement-db/
# trên VPS), database RIÊNG 'procurement_dev' — CÙNG máy chủ CSDL với prod, khác database.
# Chạy: docker compose --env-file .env.dev -f docker-compose.dev.yml up -d --build
#   ⚠ KHÔNG truyền `-p procurement-dev`. Stack dev đang chạy thật nằm dưới project
#   `procurement-tool-dev` (tên mặc định theo thư mục); thêm `-p` là compose tưởng đây là stack
#   khác, đẻ ra một bộ container song song rồi chết ở `Conflict. The container name "/erp-dev"
#   is already in use`. Kiểm: docker ps --format '{{.Names}}\t{{.Label "com.docker.compose.project"}}'
#
# ⚠ Trên VPS, ~/procurement-tool-dev và ~/procurement-tool là HAI WORKTREE của cùng 1 repo git,
#   nên phải giữ KHÁC NHÁNH: dev = `erp-v2`, prod = `main`. Nếu để chung nhánh thì lần deploy sau
#   `git pull` ở worktree này sẽ dời ref chung, worktree kia báo "Already up to date" và im lặng
#   build lại code CŨ. Cập nhật code luôn bằng:
#       cd ~/procurement-tool-dev && git fetch origin && git reset --hard origin/erp-v2
#   rồi kiểm `git status --short` phải RỖNG trước khi build.
#   (Từ 18/08/2026 dev đổi từ `bao` sang `erp-v2` để chạy song song hai giao diện; `bao` được
#   merge vào `erp-v2` chứ không bỏ — nhánh tính năng nào cũng phải về `erp-v2` mới lên dev.)
#
# Luật nhánh + quy trình deploy đầy đủ: doc/tai-lieu-ky-thuat/quy-trinh-nhanh-va-deploy.md
# Khác prod: KHÔNG db-forward; web build cho domain devthumua. Có celery-beat (1 lần/ngày,
# BACKUP_ONCE_DAILY=true) — chỉ stack này chạy beat, devthumua dùng chung DB không thêm beat.
# Có thêm `erp` (frontend-v2) mà prod chưa có — giao diện mới chạy song song bản cũ để đối chiếu.
services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    env_file: .env.dev
    restart: always
    command: ["sh", "start.prod.sh"]
    networks:
      - dego-db
      - procurement-internal

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web.prod
      args:
        VITE_API_URL: "https://devthumua.degoholding.vn"
        VITE_GOOGLE_CLIENT_ID: "${VITE_GOOGLE_CLIENT_ID:-}"
        VITE_DEVELOPER_MODE: "${VITE_DEVELOPER_MODE:-}"
        VITE_PWA_INSTALL_PROMPT: "${VITE_PWA_INSTALL_PROMPT:-}"
        VITE_FEATURE_TICKET: "${VITE_FEATURE_TICKET:-on}"   # Phiếu hỗ trợ (ticket): dev mặc định BẬT
        VITE_HELP_URL: "https://devhelp.degoholding.vn"      # Trung tâm HDSD là app riêng (subdomain riêng)
    container_name: procurement-web-dev
    restart: always
    depends_on:
      - api
    networks:
      - procurement-internal
      - proxy-tier

  # ERP v2 (frontend-v2/) — giao diện mới, chạy SONG SONG với `web` chứ không thay thế.
  # Tunnel trỏ deverp.degoholding.vn -> http://erp-dev:80 (khai tay trên Cloudflare Zero Trust).
  # Tên container KHÔNG mang tiền tố `procurement-` như `web`/`help`: hai cái kia là app Thu mua,
  # còn đây là ERP — cùng repo nhưng khác sản phẩm, để tên cũ là đọc nhầm.
  # Không mở cổng ra host: vào bằng domain qua tunnel, giống `web` và `help`.
  erp:
    build:
      context: .
      dockerfile: docker/Dockerfile.erp.prod
      args:
        VITE_API_URL: ""                                # rỗng = gọi cùng origin, nginx proxy /api -> api:8000
        VITE_APP_NAME: "DEGO ERP (dev)"
        VITE_HELP_URL: "https://devhelp.degoholding.vn"
        VITE_DEVELOPER_MODE: "${VITE_DEVELOPER_MODE:-}"  # =dev thì hiện "Đổi tài khoản nhanh", giống `web`
    container_name: erp-dev
    restart: always
    depends_on:
      - api
    networks:
      - procurement-internal
      - proxy-tier

  # Trung tâm Hướng dẫn sử dụng — bản dev. Tunnel trỏ devhelp.degoholding.vn -> http://procurement-help-dev:80
  help:
    build:
      context: .
      dockerfile: docker/Dockerfile.help.prod
      args:
        VITE_API_URL: ""        # rỗng = gọi cùng origin, nginx trong container proxy /api -> api:8000
    container_name: procurement-help-dev
    restart: always
    depends_on:
      - api
    networks:
      - procurement-internal
      - proxy-tier

  redis:
    image: redis:7.2-alpine
    restart: always
    command: redis-server --save 60 1
    volumes:
      - redis_data:/data
    networks:
      - procurement-internal

  # Kho vector loại B (HDSD + FAQ). KHÔNG mở cổng ra ngoài — chỉ api gọi qua mạng nội bộ
  # (QDRANT_URL=http://qdrant:6333). Soi khi cần bằng SSH tunnel như MySQL.
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-dev
    restart: always
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - procurement-internal

  celery-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    env_file: .env.dev
    restart: always
    command: celery -A app.core.celery_app worker -l info -c 1
    depends_on:
      - redis
      - api
    networks:
      - dego-db
      - procurement-internal

  # Bật lại beat cho dev (prod vốn có, dev trước đây tắt). Dev đặt BACKUP_ONCE_DAILY=true
  # trong .env.dev nên chỉ chạy sao lưu 1 lần/ngày (01:00). CHỈ stack deverp này chạy beat —
  # devthumua dùng chung DB, thêm beat nữa là nhân đôi bản sao lưu.
  celery-beat:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    env_file: .env.dev
    restart: always
    command: celery -A app.core.celery_app beat -l info --scheduler celery.beat:PersistentScheduler --schedule /app/beatdata/celerybeat-schedule
    depends_on:
      - redis
      - celery-worker
    volumes:
      - beat_data:/app/beatdata   # giữ mốc lịch (celerybeat-schedule) qua các lần dựng lại
    networks:
      - procurement-internal

networks:
  dego-db:
    external: true
  proxy-tier:
    external: true
  procurement-internal:
    driver: bridge

volumes:
  redis_data:
  beat_data:
  qdrant_data:
