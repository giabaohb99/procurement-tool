services:
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-p${DB_ROOT_PASSWORD}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  adminer:
    image: adminer:4
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    env_file: .env
    volumes:
      - ./backend:/app # mount code -> hot reload, không cần build lại
      - ./test:/app/test # mount test dir để pytest chạy trong container
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    environment:
      VITE_API_URL: ${VITE_API_URL}
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
      VITE_DEVELOPER_MODE: ${VITE_DEVELOPER_MODE}
      VITE_HELP_URL: ${VITE_HELP_URL:-http://localhost:8082}
    volumes:
      - ./frontend:/app # mount code -> HMR
      - /app/node_modules # giữ node_modules trong container
    ports:
      - "8080:5173"
    depends_on:
      - api

  # App Hướng dẫn sử dụng (tách riêng khỏi web, dùng chung backend api)
  help:
    build:
      context: .
      dockerfile: docker/Dockerfile.help
    environment:
      VITE_API_URL: ${VITE_API_URL}
    volumes:
      - ./help-center:/app # mount code -> HMR
      - /app/node_modules # giữ node_modules trong container
    ports:
      - "8082:5173"
    depends_on:
      - api

  # --- Celery / Redis (chạy tác vụ ngầm + theo lịch) ---
  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: redis-server --save 60 1

  # GUI quản lý Redis (CHỈ dev) → http://localhost:5540
  redisinsight:
    image: redis/redisinsight:latest
    restart: unless-stopped
    ports:
      - "5540:5540"
    depends_on:
      - redis
    volumes:
      - redisinsight_data:/data

  celery-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    env_file: .env
    volumes:
      - ./backend:/app # mount code -> hot reload tasks (restart worker khi sửa)
    command: celery -A app.core.celery_app worker -l info -c 2
    depends_on:
      - redis
      - api # api start.sh chạy migrate/seed trước

  celery-beat:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    env_file: .env
    volumes:
      - ./backend:/app
    command: celery -A app.core.celery_app beat -l info --scheduler celery.beat:PersistentScheduler
    depends_on:
      - redis
      - celery-worker

volumes:
  db_data:
  redisinsight_data:
